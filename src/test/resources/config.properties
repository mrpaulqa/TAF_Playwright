# Default configuration. Any value can be overridden with a -D system property
# or an UPPER_SNAKE_CASE environment variable (e.g. db.url -> DB_URL).

# --- UI (Playwright) ---
ui.baseUrl=https://playwright.dev
ui.headless=true
ui.secondaryURL=https://www.saucedemo.com/inventory.html
browser=safari
# --- API (REST Assured) ---
api.baseUrl=https://jsonplaceholder.typicode.com
api.thinkingTester =https://thinking-tester-contact-list.herokuapp.com

# --- DB (JDBC) ---
# Default: embedded H2 in MySQL-compatibility mode so tests run with no extra setup.
# To test against the Docker MySQL container, override with the MySQL values below
# (see README / docker-compose.yml), e.g.:
#   ./gradlew test -Ddb.url=jdbc:mysql://localhost:3306/test_db \
#                  -Ddb.driver=com.mysql.cj.jdbc.Driver \
#                  -Ddb.user=test_user -Ddb.password=test_pass
db.url=jdbc:h2:mem:test_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
db.driver=org.h2.Driver
db.user=sa
db.password=
