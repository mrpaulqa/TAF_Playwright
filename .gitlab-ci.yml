image: mcr.microsoft.com/playwright/java:v1.40.0-jammy

stages:
  - test

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  PLAYWRIGHT_HEADLESS: "true" # Гарантируем headless-режим

test_job:
  stage: test
  script:
    - chmod +x ./gradlew
    # Включаем headless через системные параметры Java (если передаешь через System.getProperty)
    - ./gradlew clean test -Dheadless=true -Dapi.thinkingEmail="$THINKING_EMAIL" -Dapi.thinkingPassword="$THINKING_PASSWORD"

  artifacts:
    when: always
    paths:
      - build/reports/tests/test/
      - target/playwright/ # Если сохраняешь скриншоты/трассировки
    reports:
      junit: build/test-results/test/TEST-*.xml
    expire_in: 1 week